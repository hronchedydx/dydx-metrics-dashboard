name: Refresh dYdX Metrics

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    name: Query BigQuery → update metrics.json
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install "google-cloud-bigquery[bqstorage]" db-dtypes

      - name: Run BigQuery fetch
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python queries/fetch_metrics.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json
          git diff --staged --quiet \
            || git commit -m "data: refresh metrics $(date -u +%Y-%m-%d)"
          git push
